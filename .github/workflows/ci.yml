name: Python and browser checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[server,test]"
      - name: Compile Python modules
        run: python -m compileall -q agents qmc_simulator tests cli.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test installed sampler CLI
        run: quantum-monte-carlo-qmc-engine vmc --alpha 1 --samples 200 --seed 7

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: node --check web/qmc.js && node --check web/app.js
      - name: Browser algorithm tests
        run: node --test web/tests/*.test.js
